<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f6b"><link rel="manifest" href="manifest.json"><title>My Money Diary</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Arial,sans-serif;color:#17212b}.app{max-width:520px;margin:auto;min-height:100vh;background:#f7f9fc;padding-bottom:88px}header{background:#123f6b;color:#fff;padding:24px 20px 30px;border-radius:0 0 26px 26px}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}.date{opacity:.85;font-size:13px;margin-top:7px}.month{margin-top:18px;background:#ffffff20;border:1px solid #ffffff38;color:#fff;padding:11px;border-radius:13px;width:100%;font-size:16px}.content{padding:16px}.balance{background:#fff;border-radius:19px;padding:20px;margin-top:-31px;position:relative;box-shadow:0 7px 25px #00000012}.balance small,.card small,label{color:#718096}.balance h2{margin:8px 0;font-size:29px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.card,.panel{background:#fff;border-radius:17px;padding:16px;box-shadow:0 4px 15px #0000000b}.card b{display:block;font-size:18px;margin-top:7px}.in{color:#168447}.out{color:#c0392b}.section{display:none}.section.active{display:block}.title{font-size:20px;font-weight:bold;margin:6px 0 14px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button,.save{border:0;padding:15px;border-radius:14px;font-weight:bold;font-size:15px}.incomeBtn{background:#dff5e8;color:#11713d}.expenseBtn{background:#fde4e1;color:#a52d23}.panel{margin-bottom:12px}label{font-size:12px;display:block;margin:9px 0 5px}input,select{width:100%;padding:13px;border:1px solid #d9e1ea;border-radius:11px;font-size:16px;background:#fff}.save{width:100%;background:#123f6b;color:white;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f4;padding:13px 0}.item:last-child{border:0}.item small{color:#718096}.del{background:none;border:0;color:#c0392b;font-size:19px}.empty{text-align:center;color:#8491a0;padding:30px 10px}.bar{height:10px;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#123f6b;border-radius:20px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:11px;border:0;border-radius:10px}.danger{background:#fde4e1;color:#a52d23}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5eaf0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:#7a8795;padding:6px 2px;font-size:11px}nav button span{display:block;font-size:21px;margin-bottom:3px}nav button.active{color:#123f6b;font-weight:bold}.install{margin-top:12px;width:100%;background:#123f6b;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:bold;display:none}</style></head><body><div class="app"><header><div class="top"><div><h1>💰 My Money Diary</h1><div class="date" id="today"></div></div><div>📱</div></div><input class="month" id="month" type="month" onchange="render()"></header><div class="content">
<section id="home" class="section active"><div class="balance"><small>Salio ya mwezi</small><h2 id="balance">TZS 0</h2><small id="count">0 rekodi</small><button class="install" id="installBtn">📲 Install App</button></div><div class="grid"><div class="card"><small>Mapato</small><b class="in" id="income">TZS 0</b></div><div class="card"><small>Matumizi</small><b class="out" id="expense">TZS 0</b></div></div><div class="title">⚡ Ongeza haraka</div><div class="quick"><button class="incomeBtn" onclick="showForm('income')">＋ Mapato</button><button class="expenseBtn" onclick="showForm('expense')">＋ Matumizi</button></div><div class="panel" style="margin-top:14px"><b>Matumizi dhidi ya mapato</b><div class="bar"><i id="progress"></i></div><small id="percent">0%</small></div></section>
<section id="add" class="section"><div class="title">➕ Weka rekodi</div><div class="panel"><div class="row"><div><label>Tarehe</label><input id="date" type="date"></div><div><label>Aina</label><select id="type"><option value="income">Mapato</option><option value="expense">Matumizi</option></select></div></div><label>Maelezo</label><input id="note" placeholder="Mfano: Mshahara, chakula..."><label>Kiasi (TZS)</label><input id="amount" type="number" min="0" inputmode="numeric" placeholder="0"><button class="save" onclick="add()">Hifadhi rekodi</button></div></section>
<section id="history" class="section"><div class="title">📋 Rekodi</div><div id="list" class="panel"></div></section>
<section id="report" class="section"><div class="title">📊 Ripoti ya mwezi</div><div class="panel"><p>Jumla ya mapato<br><b class="in" id="ri">TZS 0</b></p><p>Jumla ya matumizi<br><b class="out" id="re">TZS 0</b></p><p>Salio<br><b id="rb">TZS 0</b></p><p>Asilimia iliyotumika<br><b id="rp">0%</b></p></div><div class="panel"><div class="actions"><button onclick="exportCSV()">⬇️ CSV</button><button class="danger" onclick="clearAll()">🗑️ Futa zote</button></div></div></section></div><nav><button class="active" onclick="tab('home',this)"><span>⌂</span>Home</button><button onclick="tab('add',this)"><span>＋</span>Weka</button><button onclick="tab('history',this)"><span>☷</span>Rekodi</button><button onclick="tab('report',this)"><span>◔</span>Ripoti</button></nav></div>
<script>
const K='my_money_diary_pwa_v1';let data=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id),money=n=>'TZS '+Number(n||0).toLocaleString('en-TZ');let now=new Date(),iso=now.toISOString().slice(0,10);$('date').value=iso;$('month').value=iso.slice(0,7);$('today').textContent=now.toLocaleDateString('sw-TZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});function save(){localStorage.setItem(K,JSON.stringify(data))}function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function showForm(t){tab('add',document.querySelectorAll('nav button')[1]);$('type').value=t}function add(){let d=$('date').value,n=$('note').value.trim(),a=Number($('amount').value);if(!d||!a)return alert('Weka tarehe na kiasi.');data.push({id:Date.now(),date:d,type:$('type').value,note:n,amount:a});save();$('note').value='';$('amount').value='';render();tab('home',document.querySelector('nav button'))}function render(){let m=$('month').value,r=data.filter(x=>x.date.startsWith(m)),inc=r.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=r.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),bal=inc-exp,p=inc?Math.min(100,exp/inc*100):0;$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(bal);$('count').textContent=r.length+' rekodi';$('progress').style.width=p+'%';$('percent').textContent=p.toFixed(1)+'%';$('ri').textContent=money(inc);$('re').textContent=money(exp);$('rb').textContent=money(bal);$('rp').textContent=p.toFixed(1)+'%';let l=$('list');l.innerHTML=r.length?'':'<div class="empty">Hakuna rekodi mwezi huu.</div>';r.sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{let e=document.createElement('div');e.className='item';e.innerHTML='<div><b>'+esc(x.note||'Bila maelezo')+'</b><br><small>'+x.date.split('-').reverse().join('/')+'</small></div><div style="text-align:right"><b class="'+(x.type==='income'?'in':'out')+'">'+(x.type==='income'?'+':'-')+money(x.amount)+'</b><br><button class="del" onclick="del('+x.id+')">×</button></div>';l.appendChild(e)})}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function del(id){data=data.filter(x=>x.id!==id);save();render()}function clearAll(){if(confirm('Futa rekodi zote?')){data=[];save();render()}}function exportCSV(){let m=$('month').value,r=data.filter(x=>x.date.startsWith(m));if(!r.length)return alert('Hakuna rekodi.');let c='Tarehe,Aina,Maelezo,Kiasi\n'+r.map(x=>`"${x.date}","${x.type}","${x.note}",${x.amount}`).join('\n'),b=new Blob(["\ufeff"+c],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-diary-'+m+'.csv';a.click()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('installBtn').style.display='none'}};render();
</script></body></html>
