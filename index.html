<!doctype html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>My Money Diary</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial;color:#111827;padding-bottom:70px}header{background:#111827;color:#fff;padding:18px}.bal{font-size:28px;font-weight:bold}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,button{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#111827;color:white;border:0;font-weight:bold}.danger{background:#b91c1c}.light{background:#e5e7eb;color:#111}.row,.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;background:#f9fafb;border-radius:10px}.item{border-top:1px solid #eee;padding:12px 0}.in{color:#15803d}.ex{color:#b91c1c}.small{font-size:13px;color:#666}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(5,1fr);z-index:5;border-top:1px solid #ddd}nav button{margin:0;background:white;color:#666;border-radius:0;font-size:12px}nav .active{color:#111;font-weight:bold}.lock{position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.lock .card{width:100%;max-width:380px;text-align:center}</style>
<div id="lock" class="lock hidden"><div class="card"><h2>🔐 My Money Diary</h2><p>Ingiza PIN kufungua app</p><input id="pinIn" type="password" inputmode="numeric" maxlength="6"><button onclick="unlock()">Fungua</button><p id="err" class="small"></p></div></div>
<div id="app"><header><h2>💰 My Money Diary</h2>Balance<div id="balance" class="bal">TZS 0</div></header><main>
<section id="home"><div class="card"><h2>➕ Weka rekodi</h2><input id="date" type="date"><div class="row"><input id="income" type="number" placeholder="Mapato TZS"><input id="expense" type="number" placeholder="Matumizi TZS"></div><input id="note" placeholder="Maelezo"><button onclick="add()">Weka Rekodi</button></div>
<div class="card"><h2>📊 Muhtasari wa mwezi</h2><input id="month" type="month" onchange="render()"><div class="stats"><div class="stat">Mapato<b id="mi">TZS 0</b></div><div class="stat">Matumizi<b id="me">TZS 0</b></div></div><div class="stat">Balance<b id="mb">TZS 0</b></div></div></section>
<section id="records" class="hidden"><div class="card"><h2>📒 Rekodi</h2><div id="list"></div></div></section>
<section id="reports" class="hidden"><div class="card"><h2>📈 Ripoti</h2><p id="report"></p><button onclick="csv()">⬇️ Export CSV</button><button class="danger" onclick="wipe()">🗑️ Futa zote</button></div></section>
<section id="settings" class="hidden"><div class="card"><h2>⚙️ Settings</h2><p class="small">PIN ni lock ya kawaida; si encryption ya kiwango cha benki.</p><input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN mpya 4–6 digits"><button onclick="setPin()">🔐 Weka / Badili PIN</button><button class="light" onclick="removePin()">🔓 Ondoa PIN</button><hr><h3>💾 Backup & Restore</h3><button onclick="backup()">⬇️ Backup Data</button><input type="file" accept=".json" onchange="restore(event)"></div></section></main>
<nav><button class="active" onclick="tab('home',this)">🏠<br>Nyumbani</button><button onclick="tab('records',this)">📒<br>Rekodi</button><button onclick="tab('reports',this)">📈<br>Ripoti</button><button onclick="tab('settings',this)">⚙️<br>Settings</button><button onclick="location.reload()">🔄<br>Refresh</button></nav></div>
<script>
const K='my_money_diary_pwa_v1',P='money_diary_pin';let data=JSON.parse(localStorage.getItem(K)||'[]'),fmt=n=>new Intl.NumberFormat('sw-TZ').format(+n||0),d=new Date().toISOString().slice(0,10);date.value=d;month.value=d.slice(0,7);
function save(){localStorage.setItem(K,JSON.stringify(data))}
function render(){let I=0,E=0;data.forEach(x=>{I+=+x.income||0;E+=+x.expense||0});balance.textContent='TZS '+fmt(I-E);let m=month.value,a=data.filter(x=>x.date.startsWith(m)),i=0,e=0;a.forEach(x=>{i+=+x.income||0;e+=+x.expense||0});mi.textContent='TZS '+fmt(i);me.textContent='TZS '+fmt(e);mb.textContent='TZS '+fmt(i-e);list.innerHTML=a.slice().sort((x,y)=>y.date.localeCompare(x.date)).map(x=>'<div class="item"><b>'+x.date+'</b><div>'+x.note+'</div><div class="in">Mapato: TZS '+fmt(x.income)+'</div><div class="ex">Matumizi: TZS '+fmt(x.expense)+'</div></div>').join('')||'<p class="small">Hakuna rekodi.</p>';report.innerHTML='Mwezi <b>'+m+'</b>: Mapato TZS '+fmt(i)+', Matumizi TZS '+fmt(e)+', Balance TZS '+fmt(i-e)}
function add(){let i=+income.value||0,e=+expense.value||0;if(!i&&!e)return alert('Weka kiasi.');data.push({id:Date.now(),date:date.value,income:i,expense:e,note:note.value.trim()});save();income.value=expense.value=note.value='';render();alert('Imehifadhiwa ✅')}
function tab(id,b){['home','records','reports','settings'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function dl(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function backup(){dl(new Blob([JSON.stringify({app:'My Money Diary',version:2,createdAt:new Date().toISOString(),records:data},null,2)],{type:'application/json'}),'money-diary-backup.json')}
function restore(ev){let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result),a=Array.isArray(o)?o:o.records;if(!Array.isArray(a))throw 1;let m=new Map(data.map(x=>[String(x.id),x]));a.forEach(x=>{if(x&&x.date)m.set(String(x.id||Date.now()+Math.random()),x)});data=[...m.values()];save();render();alert('Backup imerudishwa ✅')}catch(e){alert('Backup si sahihi')}};r.readAsText(ev.target.files[0]);ev.target.value=''}
function csv(){let s='Tarehe,Maelezo,Mapato,Matumizi,Balance\n';data.forEach(x=>s+=x.date+',"'+(x.note||'').replaceAll('"','""')+'",'+x.income+','+x.expense+','+((x.income||0)-(x.expense||0))+'\n');dl(new Blob([s],{type:'text/csv'}),'money-diary.csv')}
function wipe(){if(confirm('Futa rekodi zote?')){data=[];save();render()}}
function setPin(){let x=newPin.value;if(!/^\d{4,6}$/.test(x))return alert('PIN iwe tarakimu 4 hadi 6.');localStorage.setItem(P,x);newPin.value='';alert('PIN imewekwa ✅')}
function removePin(){let x=localStorage.getItem(P);if(!x)return alert('Hakuna PIN.');if(prompt('PIN ya sasa')===x){localStorage.removeItem(P);alert('PIN imeondolewa ✅')}else alert('PIN si sahihi')}
function unlock(){if(pinIn.value===localStorage.getItem(P)){lock.classList.add('hidden');app.classList.remove('hidden')}else err.textContent='PIN si sahihi.'}
if(localStorage.getItem(P)){app.classList.add('hidden');lock.classList.remove('hidden')}render();
</script></html>
